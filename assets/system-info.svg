<svg width="1000" height="430" viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1000" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F2740" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .line {
      opacity: 0;
      animation: reveal 0.55s ease forwards;
    }

    .cursor {
      animation: blink 0.9s step-end infinite;
    }

    .scan {
      animation: scan 5s linear infinite;
    }

    .pulse {
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    @keyframes scan {
      0%   { transform: translateY(-10px); opacity: 0; }
      15%  { opacity: .22; }
      85%  { opacity: .18; }
      100% { transform: translateY(420px); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
  </style>

  <rect x="1.5" y="1.5" width="997" height="427" rx="18" fill="#080D14" stroke="url(#border)" stroke-width="3"/>
  <rect x="10" y="10" width="980" height="410" rx="14" fill="url(#grid)" opacity="0.85"/>

  <!-- title bar -->
  <circle cx="30" cy="28" r="6" fill="#FF5F57"/>
  <circle cx="50" cy="28" r="6" fill="#FEBB2E"/>
  <circle cx="70" cy="28" r="6" fill="#28C840"/>

  <text x="500" y="33" text-anchor="middle" class="mono" font-size="13" fill="#7A8AA0">
    logivoid@dev ~ ./profile.sh --live
  </text>

  <line x1="22" y1="48" x2="978" y2="48" stroke="#18324A" stroke-width="1"/>

  <!-- header -->
  <text x="42" y="78" class="mono" font-size="14" fill="#00E5FF">SYSTEM.INFO</text>
  <text x="150" y="78" class="mono" font-size="14" fill="#7C3AED">logivoid@dev</text>
  <text x="927" y="78" class="mono pulse" font-size="12" fill="#14F195">● ONLINE</text>

  <!-- lines -->
  <g class="mono" font-size="16">
    <g class="line" style="animation-delay:.25s">
      <text x="52" y="118" fill="#5F6B7A">Subject</text>
      <text x="182" y="118" fill="#2C3D50">...................................</text>
      <text x="510" y="118" fill="#E6EDF3">Ahmad Hassan</text>
    </g>

    <g class="line" style="animation-delay:.55s">
      <text x="52" y="148" fill="#5F6B7A">Role</text>
      <text x="182" y="148" fill="#2C3D50">...................................</text>
      <text x="510" y="148" fill="#E6EDF3">Computer Engineering Student</text>
    </g>

    <g class="line" style="animation-delay:.85s">
      <text x="52" y="178" fill="#5F6B7A">Origin</text>
      <text x="182" y="178" fill="#2C3D50">...................................</text>
      <text x="510" y="178" fill="#E6EDF3">Lebanon</text>
    </g>

    <g class="line" style="animation-delay:1.15s">
      <text x="52" y="208" fill="#5F6B7A">Focus</text>
      <text x="182" y="208" fill="#2C3D50">...................................</text>
      <text x="510" y="208" fill="#E6EDF3">UAV · Robotics · AI Automation · MEV</text>
    </g>

    <g class="line" style="animation-delay:1.45s">
      <text x="52" y="238" fill="#5F6B7A">Status</text>
      <text x="182" y="238" fill="#2C3D50">...................................</text>
      <text x="510" y="238" fill="#14F195">Building · Researching · Shipping</text>
    </g>

    <g class="line" style="animation-delay:1.75s">
      <text x="52" y="283" fill="#00E5FF">Core.Lang</text>
      <text x="182" y="283" fill="#2C3D50">..............................</text>
      <text x="510" y="283" fill="#E6EDF3">Python · C · C++ · C# · JS · TS</text>
    </g>

    <g class="line" style="animation-delay:2.05s">
      <text x="52" y="313" fill="#00E5FF">Core.Systems</text>
      <text x="182" y="313" fill="#2C3D50">...........................</text>
      <text x="510" y="313" fill="#E6EDF3">ESP32 · Sensor Fusion · Real-Time</text>
    </g>

    <g class="line" style="animation-delay:2.35s">
      <text x="52" y="343" fill="#00E5FF">Core.Data</text>
      <text x="182" y="343" fill="#2C3D50">..............................</text>
      <text x="510" y="343" fill="#E6EDF3">MongoDB · SQL · REST · JSON</text>
    </g>

    <g class="line" style="animation-delay:2.65s">
      <text x="52" y="373" fill="#00E5FF">Core.Tools</text>
      <text x="182" y="373" fill="#2C3D50">.............................</text>
      <text x="510" y="373" fill="#E6EDF3">Git · GitHub · Unity 6</text>
    </g>

    <g class="line" style="animation-delay:3.0s">
      <text x="52" y="405" fill="#7C3AED">$</text>
      <text x="70" y="405" fill="#C9D1D9">profile.status</text>
      <text x="205" y="405" fill="#14F195">READY</text>
      <rect x="260" y="391" width="9" height="17" rx="1" fill="#00E5FF" class="cursor"/>
    </g>
  </g>

  <!-- moving scanline -->
  <rect x="18" y="0" width="964" height="2" fill="#00E5FF" class="scan" opacity="0.15" filter="url(#glow)"/>
</svg>
